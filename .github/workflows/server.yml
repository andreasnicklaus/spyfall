name: Build and push server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-26.04
    outputs:
      serverChanged: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            server:
              - 'backend/**'
              - '.github/workflows/server.yml'

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.serverChanged == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Run Node checks
        run: node --check src

  docker-build:
    needs:
      - detect-changes
      - test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            anicklaus/spyfall_backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
